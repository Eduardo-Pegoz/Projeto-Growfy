services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: growfy
      POSTGRES_USER: growfy
      POSTGRES_PASSWORD: local-growfy-only
    ports:
      - "5432:5432"
    volumes:
      - growfy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growfy -d growfy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  growfy-postgres-data:

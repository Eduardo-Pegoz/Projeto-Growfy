<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - Growfy</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-card">
        <a class="brand" href="index.html">Grow<span>fy</span></a>
        <h1>Redefinir senha</h1>
        <p>Escolha uma nova senha com pelo menos 12 caracteres.</p>
        <form id="passwordResetCompleteForm" novalidate>
            <label for="password">Nova senha</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="72">
            <button type="submit">Salvar nova senha</button>
            <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
        </form>
        <a href="login.html">Voltar para entrar</a>
    </main>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
